name: Native regression
'on': [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install NumPy for the generator spectral checks
        run: 'python3 -m pip install --only-binary=:all: numpy==2.3.5'
      - name: Native regression and explicit coverage summary
        run: make check
      - name: CLI preservation and authoring guide examples
        run: python3 -B tests/cli_safety.py
      - name: Song catalog export and provenance contracts
        run: make check-catalog
      - name: Complete bridge linking and record regression
        run: make -C bindings/native check link-smoke
      - name: Portable TL headers, versions and cross-runtime identity
        run: |
          python3 -I -B tests/tl_document.py --harness build/s12e10p1v1/harness
          python3 -I -B tests/tl_document_native.py
          node --test tests/tl_document.test.mjs tests/profile_worker.mjs
      - name: Browser package lifecycle
        run: python3 -B tests/package_web.py
      - name: Browser player, song links and offline agent bundles
        run: |
          node tests/browser_contract.mjs
          node --test tests/links_problem.test.mjs tests/agent_bundle.test.mjs
