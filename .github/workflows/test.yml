name: Native regression
'on': [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Native regression and explicit coverage summary
        run: make check
      - name: CLI preservation and authoring guide examples
        run: python3 -B tests/cli_safety.py
      - name: Complete bridge linking and record regression
        run: make -C bindings/native check link-smoke
      - name: Browser package lifecycle
        run: python3 -B tests/package_web.py
